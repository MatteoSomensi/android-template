name: Template smoke test

on:
  pull_request:
    paths:
      - "build-logic/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/template-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    strategy:
      matrix:
        preset: [standard, full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Bootstrap generated project
        run: >-
          ./gradlew bootstrapTemplate --no-daemon --no-configuration-cache
          -Ptemplate.appName="Smoke Test"
          -Ptemplate.packageName=dev.smoke.generated
          -Ptemplate.repository=example/android-template-smoke
          -Ptemplate.deepLinkScheme=smoke
          -Ptemplate.preset=${{ matrix.preset }}
      - name: Assert cleanup
        run: |
          ! grep -R -E --exclude-dir=.git --exclude-dir=.gradle --exclude-dir=build 'com\.example\.androidtemplate|id\("template\.bootstrap"\)|bootstrapTemplate|template\.appName|TEMPLATE_' .
          grep -F 'example/android-template-smoke' README.md
          ! grep -F 'android-template-smoke-smoke' README.md
          test -f core/database/schemas/dev.smoke.generated.core.database.TemplateDatabase/1.json
          test ! -e core/database/schemas/com.example.androidtemplate.core.database.TemplateDatabase
          test ! -f .github/workflows/template-smoke.yml
      - run: ./gradlew verifyModuleBoundaries ktlintCheck testDebugUnitTest assembleDebug --no-daemon
