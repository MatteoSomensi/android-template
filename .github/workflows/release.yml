name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to release
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Resolve and validate version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
      - run: ./gradlew qualityGate --no-daemon
      - name: Build release bundle and SBOM
        run: >-
          ./gradlew bundleRelease :app:cyclonedxDirectBom --no-daemon
          -PVERSION_NAME=${{ steps.version.outputs.name }}
          -PVERSION_CODE=${{ github.run_number }}
      - name: Sign release
        id: sign
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.SIGNING_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Generate checksums
        run: |
          sha256sum "${{ steps.sign.outputs.signedReleaseFile }}" > release.sha256
          tar -czf sbom.tgz -C app/build/reports cyclonedx-direct
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ steps.sign.outputs.signedReleaseFile }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          "${{ steps.sign.outputs.signedReleaseFile }}"
          release.sha256
          sbom.tgz
          --generate-notes
      - name: Publish to Play Internal
        if: vars.PLAY_PUBLISH_ENABLED == 'true'
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.androidtemplate
          releaseFiles: ${{ steps.sign.outputs.signedReleaseFile }}
          track: internal
          status: completed
